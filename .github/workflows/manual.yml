name: Manual Build Lua
run-name: "Build Lua version: ${{ inputs.lua-version }}"

on:
  workflow_dispatch:
    inputs:
      lua-version:
        description: 请输入要构建的 Lua 版本
        require: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: Windows-x86_64
            os: windows-latest
            arch: x86_64
            msys2-sys: CLANG64
          - name: Windows-arm64
            os: windows-11-arm
            arch: arm64
            msys2-sys: CLANGARM64
          - name: macOS-arm64
            os: macos-latest
            arch: arm64
          - name: macOS-x86_64
            os: macos-26-intel
            arch: x86_64
          - name: Linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: Linux-arm64
            os: ubuntu-26.04-arm
            arch: x86_64
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download Make Windows
        if: ${{ startsWith(matrix.build.os, 'windows') }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.build.msys2-sys }}
          install: >-
            mingw-w64-clang-aarch64-make
            mingw-w64-clang-aarch64-gcc-compat
      - name: Download Make macOS
        if: ${{ startsWith(matrix.build.os, 'macos') }}
        run: |
          brew install gcc make
      - name: Download Make Linux
        if: ${{ startsWith(matrix.build.os, 'ubuntu') }}
        run: |
          sudo apt install build-essential
      - name: Download and unzip Lua Source
        run: |
          curl -o lua.tar.gz https://www.lua.org/ftp/lua-${{ inputs.lua-version }}.tar.gz
          tar -xzf lua.tar.gz
      - name: Start Build
        if: ${{ startsWith(matrix.build.os, 'windows') }}
        run: |
          cd lua-${{ inputs.lua-version }}
          make mingw
      - name: Start Build
        if: ${{ ! startsWith(matrix.build.os, 'windows') }}
        run: |
          cd lua-${{ inputs.lua-version }}
          make
      - name: Copy Lua Executable file to 'bin'
        if: ${{ startsWith(matrix.build.os, 'windows') }}
        run: |
          cd lua-${{ inputs.lua-version }}
          mkdir lua-${{ inputs.lua-version }}\bin
          move src\lua*.exe bin\
          move src\lua*.dll bin\
      - name: Copy Lua Executable file to 'bin'
        if: ${{ ! startsWith(matrix.build.os, 'windows') }}
        run: |
          cd lua-${{ inputs.lua-version }}
          mkdir lua-${{ inputs.lua-version }}/bin
          mv src/lua bin/lua
          mv src/luac bin/luac
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: lua-${{ matrix.build.name }}-Bundle
          path: ./lua-${{ inputs.lua-version }}